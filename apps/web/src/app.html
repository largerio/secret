<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0e0f13" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var m = localStorage.getItem("secret_theme");
					if (m !== "dark" && m !== "light") m = "dark";
					document.documentElement.dataset.mode = m;
				} catch (_) {
					document.documentElement.dataset.mode = "dark";
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function () {
				try {
					document.body.dataset.mode = document.documentElement.dataset.mode || "dark";
				} catch (_) {}
			})();
		</script>
	</body>
</html>
