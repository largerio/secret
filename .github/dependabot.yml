version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Proposes no version published less than three days ago: past the two
    # days pnpm requires (minimumReleaseAge in pnpm-workspace.yaml), so the
    # lockfile it writes passes them.
    cooldown:
      default-days: 3
    groups:
      dependencies:
        patterns: ["*"]
        # Group only patch/minor; major bumps come as separate PRs and are
        # never auto-merged (see .github/workflows/dependabot-label.yml).
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    labels: ["dependencies"]

  # Base image digest in the Dockerfiles (node:26-alpine@sha256:...). Back on
  # trial: since June its jobs dropped every digest as already proposed by
  # #53, closed since May. .github/workflows/base-image.yml proposes them
  # meanwhile; whichever PR lands first, the other closes itself.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
    labels: ["docker"]

  # Actions pinned by commit SHA in .github/workflows/*.yml, and in the local
  # composite actions, which Dependabot only reads from the directories listed.
  # Never auto-merged: an action runs with the workflow's tokens.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
    labels: ["github-actions"]
