version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
        # Group only patch/minor; major bumps come as separate PRs and are
        # never auto-merged (see .github/workflows/dependabot-label.yml).
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    labels: ["dependencies"]

  # Base image digest in the Dockerfile (node:26-alpine@sha256:...).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
    labels: ["docker"]

  # Actions pinned by commit SHA in .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
    labels: ["github-actions"]
