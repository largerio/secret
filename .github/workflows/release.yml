name: Release SDK

# Publishes @largerio/secret-sdk to npm. The app image is released by
# release-image.yml.
on:
  push:
    branches: [main]

permissions: {}

# Never run two releases at once, and never cancel an in-flight publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The build runs the lockfile's packages (tsup, esbuild, their scripts). It
  # gets a read-only token and no secret: whatever it runs cannot take the
  # App's token or the OIDC token that publishes.
  build:
    # Forks cannot satisfy the npm trusted publisher, and must not publish.
    if: github.repository == 'largerio/secret'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build the SDK
        run: pnpm --filter @largerio/secret-sdk build

      - name: Verify the publishable SDK artifact
        run: pnpm --filter @largerio/secret-sdk verify-package

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-dist
          path: packages/sdk-js/dist/
          if-no-files-found: error
          # Long enough to re-run a failed publish alone.
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the version commit and the Version Packages PR branch
      pull-requests: write # open and update the Version Packages PR
      id-token: write # OIDC: publish to npm through trusted publishing, with no token
    env:
      # `secrets` is not available to a step-level `if`, but it is here.
      HAS_RELEASE_APP: ${{ vars.APP_CLIENT_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      # GitHub starts no `pull_request` workflow for a PR opened with
      # GITHUB_TOKEN, so the Version Packages PR would reach main with no CI.
      # Opened as the release App, it gets its checks. Without the App (a
      # fork), this falls back to GITHUB_TOKEN. Setup: CONTRIBUTING.md.
      - name: Mint a GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Not the App's Workflows permission: this job runs third-party code
          # (changesets, pnpm).
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The version commit and the PR branch are pushed as the App too.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # Only what changesets and pnpm publish need: the root, for the
      # changesets CLI, and the SDK, whose workspace dependencies pnpm
      # resolves when it packs. No package's script runs, and no cache is
      # restored: a cache entry is written by jobs that run the whole
      # lockfile.
      - uses: ./.github/actions/setup
        with:
          install-args: --ignore-scripts --filter secret --filter @largerio/secret-sdk
          cache: ""

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-dist
          path: packages/sdk-js/dist/

      # With changesets pending, opens or updates the Version Packages PR.
      # Without, publishes the versions npm does not have yet.
      - name: Open the Version Packages PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # An input: v2 ignores the GITHUB_TOKEN env var, and would fall back
          # to the job's token.
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
