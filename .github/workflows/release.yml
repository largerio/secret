name: Release

on:
  push:
    branches: [main]

permissions: {}

# Never run two releases at once, and never cancel an in-flight publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Canonical repo only — forks can't satisfy the npm trusted publisher and
    # must not publish.
    if: github.repository == 'largerio/secret'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit / create the Version Packages PR branch
      pull-requests: write # open and update the Version Packages PR
      id-token: write # OIDC: authenticate to npm via trusted publishing (no token)
    env:
      # `secrets` is not one of the contexts available to a step-level `if`
      # (GitHub rejects the whole file), but it is available here — so resolve
      # it once at job level and branch on the result below.
      HAS_RELEASE_APP: ${{ secrets.APP_ID != '' }}
    steps:
      # A PR opened with the default GITHUB_TOKEN never triggers `pull_request`
      # workflows — GitHub suppresses them to avoid recursion. The "Version
      # Packages" PR therefore reached main with no CI at all: lint, typecheck,
      # tests, e2e and the SDK package check were all skipped for it. Acting as
      # a GitHub App gives it a distinct identity, so the checks run.
      #
      # Falls back to GITHUB_TOKEN when the App secrets are absent (forks, or
      # before the App is installed): releases keep working, just without CI on
      # the version PR, exactly as before.
      #
      # Setup: a GitHub App installed on this repo with only two repository
      # permissions — Contents: read/write, Pull requests: read/write — and its
      # App ID / private key stored as the APP_ID and APP_PRIVATE_KEY secrets.
      - name: Mint a GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Check out with the App token too, so the version commit is attributed
          # to the App and pushing the PR branch uses the same identity.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1; changeset publish
      # shells out to it. Pin it explicitly so we don't depend on the bundled
      # version drifting.
      - run: npm install -g npm@^11

      # changesets/action picks the action based on pending changesets:
      #   • changeset files present      → runs `version`, opens/updates the
      #     "Version Packages" PR (does NOT publish)
      #   • none present but versions are
      #     ahead of what's on npm        → runs `publish`
      # So this only ships when there is genuinely a new version to release.
      # Publishing authenticates via OIDC against the npm trusted publisher
      # configured for @largerio/secret-sdk — no NPM_TOKEN secret involved.
      - name: Create Version Packages PR or publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
