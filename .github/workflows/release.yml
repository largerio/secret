name: Release

on:
  push:
    branches: [main]

permissions: {}

# Never run two releases at once, and never cancel an in-flight publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Canonical repo only — forks can't satisfy the npm trusted publisher and
    # must not publish.
    if: github.repository == 'largerio/secret'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit / create the Version Packages PR branch
      pull-requests: write # open and update the Version Packages PR
      id-token: write # OIDC: authenticate to npm via trusted publishing (no token)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1; changeset publish
      # shells out to it. Pin it explicitly so we don't depend on the bundled
      # version drifting.
      - run: npm install -g npm@^11

      # changesets/action picks the action based on pending changesets:
      #   • changeset files present      → runs `version`, opens/updates the
      #     "Version Packages" PR (does NOT publish)
      #   • none present but versions are
      #     ahead of what's on npm        → runs `publish`
      # So this only ships when there is genuinely a new version to release.
      # Publishing authenticates via OIDC against the npm trusted publisher
      # configured for @largerio/secret-sdk — no NPM_TOKEN secret involved.
      - name: Create Version Packages PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
