name: Dependabot label

# Labels Dependabot's npm patch and minor PRs, and its base image digest
# bumps, auto-merge-48h when they open: dependabot-delayed-merge.yml arms the
# merge later. Majors stay for review, and so does every GitHub Actions
# update: an action runs with the tokens and secrets of the workflows that use
# it.
#
# `pull_request`, not `pull_request_target`: a fork's PR gets a read-only
# token and no secrets, so it could not add a label even past the guard. The
# `permissions:` block grants Dependabot's own PRs the write access.
on: pull_request

permissions: {}

jobs:
  label:
    # The PR's author, not github.actor: the actor is whoever triggered the
    # last event, which can be Dependabot on someone else's PR.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write # creating a label goes through the issues API
    steps:
      - name: Fetch the Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # --force creates the label or updates it, so it never fails on an
      # existing one.
      # Every docker PR is a digest bump: dependabot.yml ignores Node majors.
      # Its update-type cannot tell: it reads a digest bump (`7c6af15` to
      # 26-alpine) as a major.
      - name: Label npm patch and minor updates and base image digest bumps
        if: >-
          steps.meta.outputs.package-ecosystem == 'docker' || (
          steps.meta.outputs.package-ecosystem == 'npm_and_yarn' && (
            steps.meta.outputs.update-type == 'version-update:semver-patch' ||
            steps.meta.outputs.update-type == 'version-update:semver-minor'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout, so no git remote to infer the repository from.
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh label create auto-merge-48h --force \
            --color 0e8a16 \
            --description "Auto-merged once >=48h old and CI is green"
          gh pr edit "$PR_URL" --add-label auto-merge-48h
