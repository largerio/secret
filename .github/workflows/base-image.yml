name: Base image update

# Each week, if the base image the Dockerfiles pin has a newer digest
# upstream, opens the PR that moves them to it, as the release App so CI runs
# on it. Labeled auto-merge-48h, it is merged like Dependabot's patch updates
# (dependabot-delayed-merge.yml). A newer digest closes the PR it supersedes,
# and so does main pinning that digest already. rebuild-release.yml does the
# same for the latest release, without a PR. The App needs no Workflows
# permission: the commit sits on main's tip and changes Dockerfiles only.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      # `secrets` is not available to a step-level `if`, but it is here.
      HAS_RELEASE_APP: ${{ secrets.APP_ID != '' }}
    steps:
      # GitHub starts no `pull_request` workflow for a PR opened with
      # GITHUB_TOKEN. Without the App (a fork), the PR opens with no checks:
      # close and reopen it to start them.
      - name: Mint a GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned base image
        id: pinned
        run: .github/scripts/base-image.sh Dockerfile >> "$GITHUB_OUTPUT"

      # The commit is made through the API, as the App: no credentials on
      # disk, and GitHub signs it.
      - name: Propose the newest digest
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ steps.pinned.outputs.name }}
        run: |
          upstream=$(docker buildx imagetools inspect "$BASE" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if ! [[ $upstream =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No digest for $BASE upstream: '$upstream'"
            exit 1
          fi
          hex=${upstream#sha256:}
          branch="base-image/${hex:0:12}"

          # Every Dockerfile on this base, the development one included.
          declare -A pins
          mapfile -t files < <(git grep -lE "^FROM[[:space:]]+${BASE}@sha256:" -- '*Dockerfile*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No Dockerfile pins $BASE by digest"
            exit 1
          fi
          outdated=()
          for file in "${files[@]}"; do
            pins[$file]=$(.github/scripts/base-image.sh "$file" | sed -n 's/^digest=//p')
            [ "${pins[$file]}" = "$upstream" ] || outdated+=("$file")
          done

          open=$(gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("base-image/")) | "\(.number) \(.headRefName)"')
          proposed=$(awk -v branch="$branch" '$2 == branch { print $1 }' <<< "$open")
          closed=$(gh pr list --state closed --head "$branch" --json number,state \
            --jq 'map(select(.state == "CLOSED"))[0].number // empty')

          if [ "${#outdated[@]}" -eq 0 ]; then
            echo "Every Dockerfile pins $BASE@$upstream"
            proposed=""
            superseded="main already pins $BASE@$upstream."
          elif [ -n "$proposed" ]; then
            echo "#$proposed already proposes $BASE@$upstream"
            superseded="#$proposed proposes a newer digest."
          elif [ -n "$closed" ]; then
            # As Dependabot does: a bump closed by hand is not proposed again.
            echo "#$closed proposed $BASE@$upstream and was closed: not proposing it again"
            superseded=""
          else
            sed -i -E "s#^(FROM[[:space:]]+${BASE})@sha256:[0-9a-f]{64}#\1@${upstream}#" "${outdated[@]}"
            for file in "${outdated[@]}"; do
              pinned=$(.github/scripts/base-image.sh "$file" | sed -n 's/^digest=//p')
              if [ "$pinned" != "$upstream" ]; then
                echo "::error file=$file::still pins $pinned"
                exit 1
              fi
            done
            git diff

            # shellcheck disable=SC2016 # expanded in the container
            contents() { docker run --rm "$BASE@$1" sh -c 'echo "Node $(node --version | tr -d v), Alpine $(cat /etc/alpine-release)"'; }
            rows=$(for file in "${outdated[@]}"; do
                echo "| \`$file\` | \`${pins[$file]}\` | $(contents "${pins[$file]}") |"
              done)
            title="build: bump the $BASE base image"
            body=$(printf '%s\n' \
              "Upstream's \`$BASE\` is now \`$upstream\`: $(contents "$upstream")." \
              "" \
              "| File | Pinned | Contents |" \
              "|---|---|---|" \
              "$rows" \
              "" \
              "Opened by \`.github/workflows/base-image.yml\`. Once 48 hours old and green, it is merged (\`dependabot-delayed-merge.yml\`); a newer digest closes it.")

            tree=$(for file in "${outdated[@]}"; do
                jq -n --arg path "$file" --arg mode "$(git ls-files -s "$file" | cut -d' ' -f1)" \
                  --rawfile content "$file" '{path: $path, mode: $mode, type: "blob", content: $content}'
              done | jq -s --arg base "$(git rev-parse 'HEAD^{tree}')" '{base_tree: $base, tree: .}' \
              | gh api "repos/$GH_REPO/git/trees" --input - --jq .sha)
            commit=$(jq -n --arg tree "$tree" --arg parent "$(git rev-parse HEAD)" \
                --arg message "$title"$'\n\n'"To $upstream." \
                '{message: $message, tree: $tree, parents: [$parent]}' \
              | gh api "repos/$GH_REPO/git/commits" --input - --jq .sha)
            # Created anew: moving the branch an earlier run left without a PR
            # onto a newer main would bring main's workflow changes into it.
            if gh api "repos/$GH_REPO/git/ref/heads/$branch" > /dev/null 2>&1; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            fi
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$commit" > /dev/null

            gh label create auto-merge-48h --force \
              --color 0e8a16 \
              --description "Auto-merged once >=48h old and CI is green"
            url=$(gh pr create --base main --head "$branch" --title "$title" --body "$body" --label auto-merge-48h)
            echo "Opened $url"
            proposed=${url##*/}
            superseded="#$proposed proposes a newer digest."
          fi

          if [ -n "$superseded" ]; then
            while read -r number head; do
              [ -n "$number" ] || continue
              [ "$number" != "$proposed" ] || continue
              echo "Closing #$number ($head): $superseded"
              gh pr close "$number" --delete-branch --comment "$superseded"
            done <<< "$open"
          fi

          # A merged or closed bump leaves its branch behind.
          kept=$(gh pr list --state open --json headRefName --jq '.[].headRefName')
          git ls-remote --heads origin 'base-image/*' | sed 's#.*refs/heads/##' |
          while read -r stale; do
            if ! grep -qxF "$stale" <<< "$kept"; then
              echo "Deleting $stale"
              gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$stale"
            fi
          done
