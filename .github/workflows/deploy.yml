name: CI/CD

# Release tags build nothing: release-image.yml promotes the image this
# workflow built and tested when the tagged commit landed on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm test` alone never evaluates the 100% thresholds of vitest.config.ts.
      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # The unit tests import src/ and nothing else loads dist/, where a broken
      # bundle or a .d.ts importing a private package would otherwise ship.
      - name: Verify the publishable SDK artifact
        run: pnpm --filter @largerio/secret-sdk verify-package

  # A workflow file GitHub cannot parse runs nothing and reports no failure.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not tracked by Dependabot: bump the version and the digest together.
      - name: Lint the workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      # actionlint checks the run: blocks of workflows, not the scripts they call.
      - name: Lint the CI scripts
        run: find .github -name '*.sh' -print0 | xargs -0 shellcheck

  # The suite runs against the image this commit builds, on S3 storage
  # (RustFS), rather than the dev servers: a fault of the image, its proxy or
  # the S3 backend shows up before the merge. `pnpm test:e2e` alone still
  # starts the dev servers.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Install the Playwright browser
        run: pnpm --filter @largerio/e2e exec playwright install --with-deps chromium

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # For this runner's platform, loaded rather than pushed. The layers come
      # from the cache the docker job writes on main.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: secret:e2e
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha

      - name: Start the image on S3 storage
        run: .github/scripts/e2e-image.sh secret:e2e

      - name: Run the e2e suite
        env:
          E2E_BASE_URL: http://localhost:3000
        run: pnpm test:e2e

      - name: Show the logs of the image
        if: failure()
        run: docker logs secret-e2e-app

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: pnpm audit --audit-level=high --prod

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The CLI, not gitleaks-action: the action needs a paid license for an
      # organization's repositories. Not tracked by Dependabot: bump the
      # version and the checksum (from the release's _checksums.txt) together.
      # https://github.com/gitleaks/gitleaks/releases
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          # This job gates the deploy: retry, so a blip in GitHub Releases
          # does not hold one back.
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 15 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan git history for leaked secrets
        run: gitleaks git . --redact --no-banner --verbose

  # Builds each commit of main once and pushes it by digest. It is tagged
  # sha-<commit> and :main only once it has passed the gates, on arm64
  # (image-arm64) then amd64 (promote), and a release promotes it unchanged
  # (release-image.yml).
  docker:
    # Every gate: with `needs: check` alone, an image could ship while e2e
    # was still running.
    needs: [check, e2e, audit, secrets, workflows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      # Deploy this exact image: a tag could move between the scan and the
      # rollout.
      digest: ${{ steps.build.outputs.digest }}
      current: ${{ steps.current.outputs.current }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The parent too, to tell a release commit (below).
          fetch-depth: 2

      # QEMU builds the linux/arm64 image on the amd64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-running an older commit's run gives it its image, as a release
      # commit whose run was cancelled needs (release-image.yml). Once main
      # has moved on, that must not take :main or production back to it.
      - name: Tell whether main has moved on
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            tip=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            if [ "$tip" != "$GITHUB_SHA" ]; then
              echo "::notice::main is at $tip now: this run tags sha-${GITHUB_SHA:0:7} only, and deploys nothing."
              echo "current=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      # Recorded on the image, so rebuild-release.yml can tell when a newer
      # base is out.
      - name: Read the base image
        id: base
        run: .github/scripts/base-image.sh Dockerfile >> "$GITHUB_OUTPUT"

      # The API reports the latest version in CHANGELOG.md, and a release
      # promotes this very image. The release is the commit that puts a new
      # version at the top; any later one reports <version>-dev, so an image
      # of main never passes for the release before it.
      - name: Tell a release commit
        id: release
        run: .github/scripts/changelog-release.sh >> "$GITHUB_OUTPUT"

      - name: Compute the tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/largerio/secret
          # :latest follows releases (release-image.yml), never main. The
          # action's default, latest=auto, would set it here.
          flavor: |
            latest=false
          # sha-* outranks the branch so it becomes the version label: a
          # release promotes this image unchanged. release-image.yml looks it
          # up as sha-<first 7 characters>, the default format.
          tags: |
            type=sha,priority=700
            type=ref,event=branch,enable=${{ steps.current.outputs.current == 'true' }}
          labels: |
            org.opencontainers.image.base.name=${{ steps.base.outputs.name }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # No tag yet: nothing can pull this image by name until it has
          # passed the scan and the smoke test.
          outputs: type=image,name=ghcr.io/largerio/secret,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
            RELEASE=${{ steps.release.outputs.release }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

  # The arm64 image, built under QEMU, booted and scanned on an arm64 runner
  # before any tag points at it.
  image-arm64:
    needs: docker
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan and smoke-test the arm64 image
        uses: ./.github/actions/check-image
        with:
          image: ghcr.io/largerio/secret
          digest: ${{ needs.docker.outputs.digest }}
          platform: linux/arm64
          version: ${{ needs.docker.outputs.version }}

  promote:
    needs: [docker, image-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Keyless signing and the provenance attestation (promote-image).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan, smoke-test, sign and tag the image
        uses: ./.github/actions/promote-image
        with:
          image: ghcr.io/largerio/secret
          digest: ${{ needs.docker.outputs.digest }}
          tags: ${{ needs.docker.outputs.tags }}
          version: ${{ needs.docker.outputs.version }}
          sign: "true"

  # Production runs the tip of main. A release tag deploys nothing, nor does
  # a re-run once main has moved on: on a commit behind main, either would
  # roll production back.
  deploy:
    needs: [docker, promote]
    if: github.ref == 'refs/heads/main' && needs.docker.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    environment: production
    # One deploy at a time on the host, and never cancel one in flight.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy
        env:
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_DIGEST
          script: |
            set -eu
            cd /opt/secret/prod

            # What to go back to if the new image never becomes healthy.
            PREVIOUS=$(docker compose ps -q app | xargs -r docker inspect --format '{{.Image}}' 2>/dev/null || true)

            SECRET_IMAGE="ghcr.io/largerio/secret@${IMAGE_DIGEST}"
            export SECRET_IMAGE
            echo "Deploying ${SECRET_IMAGE}"

            docker compose pull
            docker compose up -d --remove-orphans

            # Healthy, not just started: a container can boot and then fail
            # every request. Then ready: the image's health check is liveness,
            # and a container that cannot reach its database or its storage
            # must not count as a good deploy either.
            HEALTH=starting
            for _ in $(seq 1 40); do
              CID=$(docker compose ps -q app)
              HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CID" 2>/dev/null || echo starting)
              case "$HEALTH" in
                healthy|none)
                  if docker exec "$CID" node -e "fetch('http://localhost:'+(process.env.PORT||3000)+'/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                    break
                  fi
                  HEALTH=unready
                  ;;
              esac
              sleep 5
            done

            if [ "$HEALTH" != "healthy" ] && [ "$HEALTH" != "none" ]; then
              echo "::error::Deployment is $HEALTH after 200s"
              docker compose logs --tail 50 app || true

              if [ -n "$PREVIOUS" ]; then
                echo "Rolling back to ${PREVIOUS}"
                SECRET_IMAGE="$PREVIOUS" docker compose up -d --remove-orphans
              else
                echo "::warning::No previous image recorded; leaving the failed container in place"
              fi
              exit 1
            fi

            echo "Healthy on ${SECRET_IMAGE}"
            # Keep a week of images, so a manual rollback has one to go back to.
            docker image prune -f --filter "until=168h"
