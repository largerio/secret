name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Runs with --coverage so the 100% thresholds in vitest.config.ts are
      # actually enforced; `pnpm test` alone never evaluates them.
      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # Nothing else loads dist/: the unit tests import src/, so a broken bundle
      # or a .d.ts referencing a private workspace package would ship unnoticed.
      - name: Verify the publishable SDK artifact
        run: pnpm --filter @largerio/secret-sdk verify-package

  # A workflow file that fails to parse does not fail loudly: GitHub silently
  # runs nothing. A bad `if:` expression took the Release workflow out of
  # service and the only visible symptom was a run with zero jobs.
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @largerio/e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high --prod

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Use the gitleaks binary directly: gitleaks-action@v2 requires a paid
      # license for organization repositories, the CLI is free (MIT).
      # NOTE: this binary download is not tracked by Dependabot — bump version
      # AND checksum together (from the release's _checksums.txt) when updating.
      # Latest: https://github.com/gitleaks/gitleaks/releases
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          # Retry: a transient reset here fails the job, and since this gate
          # blocks the deploy, a blip in GitHub Releases blocks a release.
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 15 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan git history for leaked secrets
        run: gitleaks git . --redact --no-banner --verbose

  docker:
    # Every gate must pass before an image is published: with `needs: check`
    # alone, a tag push could build, push and deploy while e2e was still
    # running — shipping a regression, a known CVE or a leaked secret.
    needs: [check, e2e, audit, secrets, workflows]
    runs-on: ubuntu-latest
    outputs:
      # The exact image that was built, pushed and scanned. Deploying by tag
      # would let a later push move it between the scan and the rollout.
      digest: ${{ steps.build.outputs.digest }}
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU enables cross-building the linux/arm64 image on the amd64 runner.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/largerio/secret
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      # Scan the pushed image for OS/library CVEs; fail on fixable HIGH/CRITICAL.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/largerio/secret@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Every PaaS injects PORT, and nothing else exercises the image — the e2e
      # suite runs the dev servers.
      - name: Smoke-test the image with an injected PORT
        run: |
          docker run -d --name smoke -e PORT=10000 -p 10000:10000 \
            ghcr.io/largerio/secret@${{ steps.build.outputs.digest }}
          for _ in $(seq 30); do
            if curl -fsS http://localhost:10000/api/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "--- the site must be served on PORT, not the raw API ---"
          curl -fsS http://localhost:10000/ | grep -q "<!doctype html" \
            || { echo "FAIL: PORT does not serve the web app"; docker logs smoke; exit 1; }
          echo "--- and its proxy must reach the API ---"
          curl -fsS http://localhost:10000/api/health | grep -q '"status":"ok"' \
            || { echo "FAIL: the web app cannot reach the API"; docker logs smoke; exit 1; }
          docker rm -f smoke

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions: {}
    environment: production
    # Serialize deployments across all refs (main pushes and v* tags share one
    # group), so concurrent merges/releases never run two SSH deploys against the
    # same host at once. cancel-in-progress stays false: never interrupt an
    # in-flight deploy; queue the next one and let it run to completion.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_DIGEST
          script: |
            set -eu
            cd /opt/secret/prod

            # What is running right now — the thing to go back to if the new
            # image never becomes healthy.
            PREVIOUS=$(docker compose ps -q app | xargs -r docker inspect --format '{{.Image}}' 2>/dev/null || true)

            SECRET_IMAGE="ghcr.io/largerio/secret@${IMAGE_DIGEST}"
            export SECRET_IMAGE
            echo "Deploying ${SECRET_IMAGE}"

            docker compose pull
            docker compose up -d --remove-orphans

            # Wait for the container to report healthy rather than assuming it.
            # A container that boots and immediately fails every request used to
            # count as a successful deploy.
            HEALTH=starting
            for _ in $(seq 1 40); do
              CID=$(docker compose ps -q app)
              HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CID" 2>/dev/null || echo starting)
              case "$HEALTH" in
                healthy|none) break ;;
              esac
              sleep 5
            done

            if [ "$HEALTH" != "healthy" ] && [ "$HEALTH" != "none" ]; then
              echo "::error::Deployment is $HEALTH after 200s"
              docker compose logs --tail 50 app || true

              if [ -n "$PREVIOUS" ]; then
                echo "Rolling back to ${PREVIOUS}"
                SECRET_IMAGE="$PREVIOUS" docker compose up -d --remove-orphans
              else
                echo "::warning::No previous image recorded; leaving the failed container in place"
              fi
              exit 1
            fi

            echo "Healthy on ${SECRET_IMAGE}"
            # Keep recent images so a manual rollback still has something to
            # pull from; an unfiltered prune deleted the only copy.
            docker image prune -f --filter "until=168h"
