name: Scheduled security scan

# The CI/CD gates only look at a commit when it lands. This scans main's
# production dependencies and the published images every day, so a CVE
# disclosed in a quiet week still turns up, as an issue.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: pnpm audit --audit-level=high --prod

  # :1 is the release line self-hosters run, :main the unreleased tip. They
  # hold different code between releases, and :1 is only rebuilt when its base
  # moves (rebuild-release.yml).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tag: ["1", main]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Scan :${{ matrix.tag }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/largerio/secret:${{ matrix.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  report:
    needs: [audit, image]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label security --state open \
            --search "Scheduled security scan in:title" \
            --json number --jq '.[0].number // empty')

          body="The daily scan failed: HIGH/CRITICAL findings, or a scan that could not run. See the run: ${RUN_URL}"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Scheduled security scan found vulnerabilities" \
              --label security --body "$body"
          fi
