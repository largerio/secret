name: Promote an image
description: >
  Tag an image already pushed by digest, once it has passed the gates every
  published image goes through: a Trivy scan, the smoke test and a signature
  check. The only way deploy.yml, release-image.yml and rebuild-release.yml
  move a tag.

inputs:
  image:
    description: Repository, without tag (ghcr.io/owner/name).
    required: true
  digest:
    description: Digest of the image to promote (sha256:...).
    required: true
  tags:
    description: Full references to point at the image, one per line.
    required: true
  version:
    description: >
      The version the image must report on /api/health: a release, or the
      release before it suffixed -dev (apps/api/src/buildInfo.ts). Empty
      skips the check.
    required: false
    default: ""
  vuln-type:
    description: >
      Package types Trivy fails on. rebuild-release.yml passes `os`: a rebuild
      keeps the release's lockfile, so only its base differs from the image it
      replaces.
    required: false
    default: os,library
  expected-current-digest:
    description: >
      If set, the first tag must still point at this digest when the tags
      move, so a tag moved by another workflow in the meantime is not
      overwritten.
    required: false
    default: ""
  sign:
    description: >
      Sign the image and attest its build provenance before the signature
      check. Only for the workflow that built the image: the provenance names
      the running workflow as its builder. The job needs `id-token: write` and
      `attestations: write`.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Trivy vulnerability scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image }}@${{ inputs.digest }}
        format: table
        exit-code: "1"
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        vuln-type: ${{ inputs.vuln-type }}

    - name: Smoke-test the image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}@${{ inputs.digest }}
        EXPECTED_VERSION: ${{ inputs.version }}
      run: '"$GITHUB_ACTION_PATH/smoke-test.sh" "$IMAGE"'

    # cosign-release is not tracked by Dependabot: bump it by hand.
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.4

    # After the gates, so a signature also says the image passed them. The
    # provenance waits as well: cosign verify accepts any bundle this
    # workflow signed, the attestation included.
    - name: Sign the image
      if: inputs.sign == 'true'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}@${{ inputs.digest }}
      run: cosign sign --yes "$IMAGE"

    - name: Attest the build provenance
      if: inputs.sign == 'true'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        # Next to the signature, for verifiers that only read the registry.
        push-to-registry: true
        # A storage record only feeds the organization's Linked Artifacts
        # page, and needs one more permission.
        create-storage-record: false

    # The command docs/self-hosting.md gives self-hosters, run on every image
    # before it gets a tag. A release finds its image by a sha-* tag: one
    # pointing at an image deploy.yml did not sign gets no release tag.
    # Renaming either workflow changes the identity self-hosters check.
    - name: Verify the signature
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}@${{ inputs.digest }}
      run: |
        cosign verify "$IMAGE" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          --certificate-identity-regexp '^https://github\.com/largerio/secret/\.github/workflows/(deploy|rebuild-release)\.yml@refs/heads/main$'

    - name: Move the tags
      shell: bash
      env:
        SOURCE: ${{ inputs.image }}@${{ inputs.digest }}
        TAGS: ${{ inputs.tags }}
        EXPECTED_CURRENT_DIGEST: ${{ inputs.expected-current-digest }}
      run: |
        mapfile -t refs <<< "$TAGS"
        "$GITHUB_ACTION_PATH/promote.sh" "$SOURCE" "${refs[@]}"
