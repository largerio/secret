services:
  app:
    # Pulls the prebuilt image published by CI — no clone or local build needed.
    # To build from source instead, comment out `image:` and uncomment `build: .`.
    image: ghcr.io/largerio/secret:latest
    # build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - secret-data:/app/data
    # All configuration is read from the .env file (copy .env.example → .env).
    env_file:
      - .env
    environment:
      # Force data paths into the persistent volume regardless of .env contents.
      - DATABASE_PATH=/app/data/secret.db
      - FILES_PATH=/app/data/files
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  secret-data:
