services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
      - "3001:3001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      # Passed through so instance limits can be exercised locally, e.g.
      # `MAX_EXPIRY=3600 make dev` to check the expiry picker narrows.
      - MAX_EXPIRY=${MAX_EXPIRY:-}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-}
      - MAX_FILES_PER_NOTE=${MAX_FILES_PER_NOTE:-}
      - PORT=3001
      - DATABASE_PATH=/app/data/secret.db
      - FILES_PATH=/app/data/files
      # Fixed 32-byte base64 key so `make dev` works on a fresh clone. The
      # previous placeholder decoded to 27 bytes and crashed the API at boot.
      - SERVER_ENCRYPTION_KEY=${SERVER_ENCRYPTION_KEY:-c2VjcmV0LWRldi1rZXktZG8tbm90LXVzZS1pbi1wcm8=}
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-105906176}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
      - CHUNK_SIZE=${CHUNK_SIZE:-4194304}
      - MAX_CHUNKED_FILE_SIZE=${MAX_CHUNKED_FILE_SIZE:-524288000}
    command: sh -c "pnpm install && pnpm dev"
    tty: true

volumes:
  node_modules:
