services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3001
      - DATABASE_PATH=/app/data/secret.db
      - FILES_PATH=/app/data/files
      - SERVER_ENCRYPTION_KEY=${SERVER_ENCRYPTION_KEY:-dev-key-change-me-in-production-32ch}
    command: pnpm dev
    tty: true

volumes:
  node_modules:
